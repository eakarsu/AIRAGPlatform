name: governed-workflow
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest discover -s backend/tests -p 'test_*.py'
      - run: python -m py_compile backend/main.py backend/config.py backend/governance_policy.py backend/routers/governance.py backend/routers/auth.py
      - run: bash -n start.sh
